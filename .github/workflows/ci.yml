name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: this repo obeys its own rules
        run: python tools/themis.py check

  end-to-end:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: build a scratch repo
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/scratch"
          cd "$RUNNER_TEMP/scratch"
          git init -q
          git config user.email "scratch@example.com"
          git config user.name "Scratch"
          printf 'def add(a, b):\n    return a + b\n' > main.py
          git add main.py
          git commit -q -m init
      - name: install.py --dry-run
        shell: bash
        working-directory: ${{ runner.temp }}/scratch
        run: python "$GITHUB_WORKSPACE/install.py" install --dry-run --defaults
      - name: install.py --defaults --yes
        shell: bash
        working-directory: ${{ runner.temp }}/scratch
        run: python "$GITHUB_WORKSPACE/install.py" install --defaults --yes
      - name: commit a normal file (must pass)
        shell: bash
        working-directory: ${{ runner.temp }}/scratch
        run: |
          git add -A
          git commit -q -m "install themis"
          python - <<'PY'
          header = '"""Purpose: multiply.\nEntry points: mul().\nInvariants: none.\nNever change without a decision: nothing.\n"""\n'
          open("util.py", "w").write(header + "def mul(a, b):\n    return a * b\n")
          PY
          git add util.py
          git commit -q -m "add util.py"
      - name: commit a file with no header (must be refused)
        shell: bash
        working-directory: ${{ runner.temp }}/scratch
        run: |
          printf 'def div(a, b):\n    return a / b\n' > bare.py
          git add bare.py
          if out=$(git commit -q -m "add bare.py" 2>&1); then
            echo "bare.py should have been refused" >&2
            exit 1
          fi
          echo "$out" | grep -q "new file has no valid header" || { echo "refused for the wrong reason: $out" >&2; exit 1; }
          git reset -q bare.py
          rm bare.py
      - name: commit an 850-line file (must be refused)
        shell: bash
        working-directory: ${{ runner.temp }}/scratch
        run: |
          python - <<'PY'
          header = '"""Purpose: a big file.\nEntry points: big().\nInvariants: none.\nNever change without a decision: nothing.\n"""\n'
          lines = ["def big():"] + ["    x = %d" % i for i in range(848)] + ["    return x"]
          open("oversized.py", "w").write(header + "\n".join(lines) + "\n")
          PY
          git add oversized.py
          if out=$(git commit -q -m "add oversized.py" 2>&1); then
            echo "oversized.py should have been refused" >&2
            exit 1
          fi
          echo "$out" | grep -q "800-line limit" || { echo "refused for the wrong reason: $out" >&2; exit 1; }
          git reset -q oversized.py
          rm oversized.py
      - name: commit a fake key (must be refused)
        shell: bash
        working-directory: ${{ runner.temp }}/scratch
        run: |
          python - <<'PY'
          header = '"""Purpose: a key.\nEntry points: none.\nInvariants: none.\nNever change without a decision: nothing.\n"""\n'
          open("creds.py", "w").write(header + 'API_KEY = "%s%s"\n' % ("sk-", "1234567890abcdef1234"))
          PY
          git add creds.py
          if out=$(git commit -q -m "add creds.py" 2>&1); then
            echo "creds.py should have been refused" >&2
            exit 1
          fi
          echo "$out" | grep -q "looks like" || { echo "refused for the wrong reason: $out" >&2; exit 1; }
          git reset -q creds.py
          rm creds.py
      - name: uninstall
        shell: bash
        working-directory: ${{ runner.temp }}/scratch
        run: python "$GITHUB_WORKSPACE/install.py" uninstall --yes
